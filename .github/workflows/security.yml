name: DevSecOps security scans

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config p/java --config p/owasp-top-ten --metrics=off \
            --text --output semgrep-report.txt --json-output=semgrep-report.json src || true
          cat semgrep-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-semgrep
          path: semgrep-report.*
          retention-days: 30

  sca:
    name: SCA y secretos en archivos (Trivy fs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy dependency and secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: table
          output: trivy-fs-report.txt
          exit-code: '0'
      - run: cat trivy-fs-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-trivy-fs
          path: trivy-fs-report.txt
          retention-days: 30

  secrets:
    name: Detección de secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --report-format json --report-path gitleaks-report.json --exit-code 0
          cat gitleaks-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-gitleaks
          path: gitleaks-report.json
          retention-days: 30

  image:
    name: Escaneo de imagen (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scan-target:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:ci
          severity: HIGH,CRITICAL
          format: table
          output: trivy-image-report.txt
          exit-code: '0'
      - run: cat trivy-image-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-trivy
          path: trivy-image-report.txt
          retention-days: 30
