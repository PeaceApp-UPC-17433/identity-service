services:
  identity-service:
    build: .
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identitydb
      DB_USERNAME: identity
      DB_PASSWORD: identity
      JWT_SECRET: local-dev-secret-change-me-local-dev-secret
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identitydb"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_DB: identitydb
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5432:5432"
    volumes:
      - identity_pg_data:/var/lib/postgresql/data

volumes:
  identity_pg_data:
