spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/identity_db}
    username: ${DB_USERNAME:identity}
    password: ${DB_PASSWORD:identity}
  flyway:
    baseline-on-migrate: true

identity:
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@peaceapp.test}
    password: ${ADMIN_PASSWORD:admin-password-local}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}

logging:
  level:
    pe.upc.peaceapp: DEBUG
