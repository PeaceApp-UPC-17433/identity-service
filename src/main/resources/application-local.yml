spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/identity_db}
    username: ${DB_USERNAME:identity}
    password: ${DB_PASSWORD:identity}
  flyway:
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: ${RABBIT_USER:peaceapp}
    password: ${RABBIT_PASSWORD:peaceapp}

identity:
  web-base-url: ${WEB_BASE_URL:http://localhost:3000}
  verification:
    otp-secret: ${OTP_SECRET:local-dev-otp-secret-change-me-please-0123456789}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@peaceapp.test}
    password: ${ADMIN_PASSWORD:admin-password-local}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}

logging:
  level:
    pe.upc.peaceapp: DEBUG
